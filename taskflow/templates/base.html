{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Task Flow helps you plan, assign, and complete work with clarity.">
  <title>{% block title %}Task Flow{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="site-overall">
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a href="{% url 'home' %}" class="brand" aria-label="Task Flow home">
        <img src="{% static 'images/logo.png' %}" alt="Task Flow" class="logo">
      </a>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'dashboard:dashboard' %}">Dashboard</a>
          <a class="btn btn-ghost" href="{% url 'projects:create' %}">+ New project</a>
          <form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-dark">Log out</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'accounts:login' %}">Log in</a>
          <a class="btn btn-primary" href="{% url 'accounts:register' %}">Get started</a>
        {% endif %}
      </div>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">Task Flow</span>
      <span>Plan. Assign. Track. Done.</span>
      <span>&copy; {% now "Y" %}</span>
    </div>
  </footer>
</body>
</html>
